<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>單字卡 - 簡易版</title>
  <link rel="stylesheet" href="style.css">
  <script>
    window.tailwind = window.tailwind || {}
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'glow-50': '#f8fafc',
            'glow-100': '#cbd5e1',
            'glow-200': '#94a3b8',
            'glow-400': '#60a5fa',
            'glow-600': '#0ea5a4',
            'glow-700': '#0f172a',
            'glow-800': '#0b1220',
            'glow-900': '#05060a',
            'glow-accent': '#38bdf8'
          },
          boxShadow: {
            'glow-lg': '0 8px 30px rgba(14,165,164,0.12)'
          },
          borderRadius: {
            'xl': '12px'
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-glow-900 text-glow-50 antialiased">
  <header class="px-6 py-5">
    <h1 class="text-2xl font-semibold">單字卡</h1>
    <p class="subtitle mt-1 text-sm text-glow-200">建立、練習與追蹤你的單字卡</p>
  </header>

  <main>
    <section class="sidebar px-6">
      <form id="cardForm" novalidate class="space-y-3 bg-glow-800 p-4 rounded-xl shadow-lg">
        <h2 class="text-lg font-medium">新增單字資料</h2>
        <label class="block text-sm">英文單字
          <input id="inputWord" type="text" placeholder="輸入英文單字" required class="mt-2 w-full rounded-md bg-glow-700 border border-glow-700 px-3 py-2 text-glow-50 focus:outline-none focus:ring-2 focus:ring-glow-400">
        </label>
        <label class="block text-sm">中文翻譯
          <textarea id="inputTranslation" rows="2" placeholder="輸入中文翻譯" required class="mt-2 w-full rounded-md bg-glow-700 border border-glow-700 px-3 py-2 text-glow-50 focus:outline-none focus:ring-2 focus:ring-glow-400"></textarea>
        </label>
        <label class="block text-sm">字根分析
          <textarea id="inputRoot" rows="2" placeholder="輸入字根分析" class="mt-2 w-full rounded-md bg-glow-700 border border-glow-700 px-3 py-2 text-glow-50 focus:outline-none focus:ring-2 focus:ring-glow-400"></textarea>
        </label>
        <label class="block text-sm">例句
          <textarea id="inputExample" rows="2" placeholder="輸入例句" class="mt-2 w-full rounded-md bg-glow-700 border border-glow-700 px-3 py-2 text-glow-50 focus:outline-none focus:ring-2 focus:ring-glow-400"></textarea>
        </label>
        <label class="block text-sm">詞性
          <input id="inputPOS" type="text" placeholder="輸入詞性，例如 noun / verb" class="mt-2 w-full rounded-md bg-glow-700 border border-glow-700 px-3 py-2 text-glow-50 focus:outline-none focus:ring-2 focus:ring-glow-400">
        </label>
        <p id="translateStatus" class="status-text text-sm text-glow-200" aria-live="polite">輸入英文單字後，會自動查詢中文翻譯。</p>
        <p id="submitStatus" class="status-text text-sm text-glow-200" aria-live="polite">填寫表單後，點擊「儲存單字」即可送出。</p>
        <div class="form-row flex gap-2 mt-2">
          <button id="autoFillBtn" type="button" class="px-3 py-2 rounded-md bg-glow-600 text-glow-900">自動翻譯</button>
          <button id="saveBtn" type="submit" class="px-3 py-2 rounded-md bg-glow-accent text-black">儲存單字</button>
          <button id="cancelEditBtn" type="button" class="px-3 py-2 rounded-md bg-glow-700 text-glow-200">取消</button>
        </div>
      </form>

      <section class="controls">
        <input id="search" placeholder="搜尋單字或解釋">
        <div class="control-row">
          <button id="shuffleBtn">隨機練習</button>
          <button id="startStudyBtn" class="primary">開始練習</button>
        </div>
        <div class="control-row">
          <button id="exportBtn">匯出 JSON</button>
          <label class="import">
            匯入
            <input id="importFile" type="file" accept="application/json">
          </label>
        </div>
      </section>

      <section class="list">
        <h3>卡片列表</h3>
        <ul id="cardList"></ul>
      </section>
    </section>

    <section class="study">
      <div class="study-header">
        <h2>練習模式</h2>
        <div class="progress" title="進度">
          <div id="progressBar"></div>
        </div>
      </div>
      <div id="cardView" class="card-view empty">
        <div class="card" id="studyCard">
          <div class="front" id="cardFront"></div>
          <div class="back" id="cardBack"></div>
        </div>
      </div>

      <div class="study-controls">
        <button id="prevBtn">上一步</button>
        <button id="flipBtn" class="accent">翻面</button>
        <button id="nextBtn">下一步</button>
        <button id="knownBtn">我會了</button>
      </div>
      <p class="note">提示：點擊卡片亦可翻面，空白卡片會阻止練習開始。</p>
    </section>
  </main>

  <footer>
    <small>儲存在本機 LocalStorage • 可匯入/匯出 JSON</small>
  </footer>

  <script src="script.js" type="module"></script>
</body>
</html>
