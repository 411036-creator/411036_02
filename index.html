<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>單字卡 - 簡易版</title>
  <script>
    window.tailwind = window.tailwind || {}
    tailwind.config = {
      theme: {
          extend: {
            colors: {
              surface: '#050505',
              panel: '#0b0b0b',
              card: '#141414',
              border: '#27211b',
              text: '#f8f4ec',
              muted: '#e6dcc0',
              accent: '#D4AF37',
              'accent-dark': '#B8860B',
              'on-accent': '#050505',
              'on-surface': '#f8f4ec'
            },
            boxShadow: {
              glow: '0 8px 30px rgba(212,175,55,0.12)'
            },
            borderRadius: {
              xl: '12px'
            }
          }
        }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
  /* Structural CSS preserved from previous stylesheet (visual styles now via Tailwind) */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial}
  main{display:grid;grid-template-columns:360px 1fr;gap:20px;padding:20px;max-width:1100px;margin:0 auto}
  .card{width:420px;height:260px;perspective:1200px;position:relative}
  .card .front,.card .back{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;font-size:1.4rem;transition:transform .5s;backface-visibility:hidden}
  .card .back{transform:rotateY(180deg);font-size:1rem}
  .card.flipped .front{transform:rotateY(180deg)}
  .card.flipped .back{transform:rotateY(360deg)}
  .card-view.empty{align-items:flex-start}
  .form-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  #cardList{list-style:none;padding:0;margin:8px 0 0;max-height:320px;overflow:auto}
  @media (max-width:900px){main{grid-template-columns:1fr;padding:12px}.card{width:100%;height:220px}}
  </style>
</head>
<body class="bg-surface text-text antialiased">
  <header class="px-6 py-5">
    <h1 class="text-2xl font-semibold">單字卡</h1>
    <p class="subtitle mt-1 text-sm text-muted">建立、練習與追蹤你的單字卡</p>
  </header>

  <main>
    <section class="sidebar px-6">
      <form id="cardForm" novalidate class="space-y-3 bg-panel p-4 rounded-xl shadow-glow">
        <h2 class="text-lg font-medium">新增單字資料</h2>
        <label class="block text-sm">英文單字
          <input id="inputWord" type="text" placeholder="輸入英文單字" required class="mt-2 w-full rounded-md bg-card border border-border px-3 py-2 text-text focus:outline-none focus:ring-2 focus:ring-accent">
        </label>
        <label class="block text-sm">中文翻譯
          <textarea id="inputTranslation" rows="2" placeholder="輸入中文翻譯" required class="mt-2 w-full rounded-md bg-card border border-border px-3 py-2 text-text focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
        </label>
        <label class="block text-sm">字根分析
          <textarea id="inputRoot" rows="2" placeholder="輸入字根分析" class="mt-2 w-full rounded-md bg-card border border-border px-3 py-2 text-text focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
        </label>
        <label class="block text-sm">例句
          <textarea id="inputExample" rows="2" placeholder="輸入例句" class="mt-2 w-full rounded-md bg-card border border-border px-3 py-2 text-text focus:outline-none focus:ring-2 focus:ring-accent"></textarea>
        </label>
        <label class="block text-sm">詞性
          <input id="inputPOS" type="text" placeholder="輸入詞性，例如 noun / verb" class="mt-2 w-full rounded-md bg-card border border-border px-3 py-2 text-text focus:outline-none focus:ring-2 focus:ring-accent">
        </label>
        <p id="translateStatus" class="status-text text-sm text-muted" aria-live="polite">輸入英文單字後，會自動查詢中文翻譯。</p>
        <p id="submitStatus" class="status-text text-sm text-muted" aria-live="polite">填寫表單後，點擊「儲存單字」即可送出。</p>
        <div class="form-row flex gap-2 mt-2">
          <button id="autoFillBtn" type="button" class="px-3 py-2 rounded-md bg-accent-dark text-on-accent">自動翻譯</button>
          <button id="saveBtn" type="submit" class="px-3 py-2 rounded-md bg-accent text-on-accent">儲存單字</button>
          <button id="cancelEditBtn" type="button" class="px-3 py-2 rounded-md bg-card text-muted">取消</button>
        </div>
      </form>

      <section class="controls mt-4 space-y-4 bg-card p-4 rounded-xl border border-border shadow-glow">
        <input id="search" placeholder="搜尋單字或解釋" class="mt-1 w-full rounded-md bg-card border border-border px-3 py-2 text-text placeholder:text-muted focus:outline-none focus:ring-2 focus:ring-accent">
        <div class="control-row flex flex-wrap gap-3">
          <button id="shuffleBtn" type="button" class="px-3 py-2 rounded-md bg-panel text-text border border-border">隨機練習</button>
          <button id="startStudyBtn" type="button" class="px-3 py-2 rounded-md bg-accent text-on-accent">開始練習</button>
        </div>
        <div class="control-row flex flex-wrap gap-3">
          <button id="exportBtn" type="button" class="px-3 py-2 rounded-md bg-panel text-text border border-border">匯出 JSON</button>
          <label class="import flex items-center gap-2 text-text">
            匯入
            <input id="importFile" type="file" accept="application/json" class="text-text">
          </label>
        </div>
      </section>

      <section class="list mt-4 bg-card p-4 rounded-xl border border-border shadow-glow">
        <h3 class="text-lg font-medium">卡片列表</h3>
        <ul id="cardList" class="mt-3 space-y-3"></ul>
      </section>
    </section>

    <section class="study bg-panel p-6 rounded-xl border border-border shadow-glow">
      <div class="study-header flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
        <h2 class="text-lg font-medium">練習模式</h2>
        <div class="progress w-full h-2 rounded-full bg-border overflow-hidden" title="進度">
          <div id="progressBar" class="h-full bg-accent transition-all duration-300"></div>
        </div>
      </div>
      <div id="cardView" class="card-view empty flex items-center justify-center bg-card rounded-xl border border-border shadow-glow p-4 min-h-[280px]">
        <div class="card" id="studyCard">
          <div class="front" id="cardFront"></div>
          <div class="back" id="cardBack"></div>
        </div>
      </div>

      <div class="study-controls mt-4 flex flex-wrap gap-3">
        <button id="prevBtn" type="button" class="px-4 py-2 rounded-md bg-panel text-text border border-border">上一步</button>
        <button id="flipBtn" type="button" class="px-4 py-2 rounded-md bg-accent text-on-accent">翻面</button>
        <button id="nextBtn" type="button" class="px-4 py-2 rounded-md bg-panel text-text border border-border">下一步</button>
        <button id="knownBtn" type="button" class="px-4 py-2 rounded-md bg-accent-dark text-on-accent">我會了</button>
      </div>
      <p class="note mt-4 text-sm text-muted">提示：點擊卡片亦可翻面，空白卡片會阻止練習開始。</p>
    </section>
  </main>

  <footer class="py-4 text-center text-sm text-muted">
    <small>儲存在本機 LocalStorage • 可匯入/匯出 JSON</small>
  </footer>

  <script src="script.js" type="module"></script>
</body>
</html>
